<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="La Aventura del Piano con el Profesor Francisco: conoce este sitio musical.">
  <title>La Aventura del Piano con el Profesor Francisco</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <div class="notes" aria-hidden="true"><span>♪</span><span>♫</span></div>
      <p class="eyebrow">Bienvenidos</p>
      <h1 id="page-title">
        <span>La Aventura del Piano</span>
        <span>con el Profesor Francisco</span>
      </h1>
      <p class="intro">Conoce este espacio musical y descubre todo lo que podrás aprender.</p>

      <div class="video-window">
        <div class="video-bar" aria-hidden="true">
          <span></span><span></span><span></span><p>Presentación</p>
        </div>
        <video id="presentationVideo" controls preload="metadata">
          <source src="Assets/veh%C3%ADculos.mp4" type="video/mp4">
          Tu navegador no puede reproducir este video.
        </video>
      </div>

      <div class="upload-area">
        <label class="upload-button" for="videoUpload"><span aria-hidden="true">▶</span> Seleccionar un video</label>
        <input id="videoUpload" type="file" accept="video/*">
        <p id="uploadStatus" role="status" aria-live="polite">Puedes elegir un video de tu dispositivo para verlo en esta ventana.</p>
      </div>
    </section>
  </main>
  <footer>© <span id="currentYear"></span>&nbsp; La Aventura del Piano con el Profesor Francisco</footer>
  <script src="script.js"></script>
</body>
</html>
